name: Change report

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: change-broadcast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Generate human-readable change report
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reported revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate report
        env:
          REPORT_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/generate_change_report.py
          --mode "$REPORT_MODE"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --event-path "$GITHUB_EVENT_PATH"
          --output change-report.md

      - name: Preserve report as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: change-report-${{ github.run_id }}
          path: change-report.md
          retention-days: 14
