[project]
name = "finance-credit-agent"
version = "0.1.0"
description = "Finance-native step-level credit assignment for tool-using trading agents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "exchange-calendars==4.13.2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pyarrow>=15,<24",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
data = [
  "scipy>=1.13,<2",
  "yfinance==1.6.0",
]
# Linux/x86_64 markers keep the default development environment CPU-only.
# Exact versions mirror the locked Agent-R1 revision; see SETUP.md.
gpu = [
  "flash-attn==2.8.0.post2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "verl==0.7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "vllm==0.9.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = [".", "third_party/agent-r1"]
testpaths = ["tests"]
markers = [
  "integration: requires external data, a model, or a GPU training runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "agent_r1.*",
  "exchange_calendars.*",
  "flash_attn",
  "flash_attn.*",
  "pandas.*",
  "torch",
  "torch.*",
  "verl",
  "verl.*",
  "vllm",
  "vllm.*",
  "yfinance.*",
]
ignore_missing_imports = true
