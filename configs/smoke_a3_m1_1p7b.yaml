extends: smoke_1p7b.yaml

run:
  name: smoke-a3-m1-qwen3-1p7b
  kind: a3_m1_wiring_smoke_1p7b

arm:
  id: A3
  name: finance_native
  optimizer: steppo
  credit_assignment: finance_native
  reward_signal: A_fin
  mechanism: m1_uniform
  credit_semantics: immediate_step_reward_v1
  scientific_role: formal_ablation

finance_credit:
  m1_uniform:
    implemented: true
    credit_semantics: immediate_step_reward_v1
    scientific_role: formal_ablation
  m2_state_regime_group:
    implemented: false
  m3_counterfactual_information:
    implemented: false

training:
  # One trajectory per prompt is sufficient for the M1 wiring-only smoke.
  rollout_n: 1
  # A single deterministic training trajectory still exercises finance credit,
  # critic update, actor update, and post-update rollout synchronization while
  # avoiding 51 serial actor microbatches in this wiring-only run.
  train_batch_size: 1
  # One complete critic -> actor update is sufficient to prove the shared
  # GAE/critic/GSPO wiring without a second train/update cycle.
  total_training_steps: 1
  # The H100 has enough device headroom for the 1.7B critic parameters. Keeping
  # them resident avoids crossing the 57.6 GiB host memory.high boundary once
  # the offloaded critic Adam state is materialized.
  critic_param_offload: false
  # The reference model is forward-only. BF16 halves its offloaded host storage
  # while matching the FSDP forward dtype, keeping this smoke below memory.high.
  reference_model_dtype: bf16
